# mdbox 配置模板：复制为 config.yaml 后按需修改。
# 首次启动若 config.yaml 不存在，程序会自动生成一份。
# 初始账号：仅在 users.yaml 中还没有该用户时写入一次（密码以 bcrypt 哈希存储），之后与普通用户无区别。
admin:
  username: admin
  password: "mdbox@111!!!"
# 分享链接签名密钥。留空则启动时自动生成；修改后所有已分享链接立即失效。
secret: ""
# 是否开放用户注册。设为 false 后只有已有用户能登录。
allow_register: true
# agent/MCP 的 token 不在这里配置：每个用户注册时自动生成并保存在 users.yaml，
# 用户可在 Web 的「MCP 接入」弹窗里查看和重置。
